<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — not found</title>
  <link rel="icon" type="image/x-icon" href="profile.png" />

  <style>
    :root{
      --bg: #0c0c0c;
      --muted-line: #333;
      --accent: #5adf72;
      --accent-2: #7cff8a;
      --text: #d0f0d0;
      --mono: "JetBrains Mono", monospace;
    }

    html,body{
      background:var(--bg);
      color:var(--text);
      font-family:var(--mono);
      margin:0;
      padding:0;
      height:100%;
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
    }

    body{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px;
      animation:vhs 4s infinite steps(1);
    }

    h1{
      font-size:3rem;
      color:var(--accent-2);
      margin:0 0 14px;
      position:relative;
      animation:glitch 2.7s infinite;
    }

    p{
      color:var(--p);
      font-size:1.05rem;
      margin:0 0 28px;
    }

    button.cta{
      background:transparent;
      border:1px solid var(--accent-2);
      padding:8px 14px;
      border-radius:6px;
      cursor:pointer;
      color:var(--accent-2);
      font-weight:600;
    }
    button.cta:hover{
      background:#7cff8a22;
    }


    body::before{
      content:"";
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      pointer-events:none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.03) 0px,
          rgba(255,255,255,0.03) 1px,
          transparent 1px,
          transparent 2px
        );
      opacity:0.2;
      mix-blend-mode:overlay;
      animation:noise 0.9s infinite;
    }

    @keyframes glitch {
      0%, 100% { text-shadow:none; transform:none; }
      7% { text-shadow:2px 0 var(--accent); }
      14% { text-shadow:-2px 0 var(--accent-2); }
      21% { transform:translate(1px,0); }
      30% { transform:translate(-1px,0); }
      40% { text-shadow:none; }
    }


    @keyframes vhs {
      0%, 100% { opacity:1; }
      50% { opacity:0.97; }
      75% { opacity:0.94; }
    }

    @keyframes noise {
      0% {opacity:0.12;}
      50% {opacity:0.18;}
      100% {opacity:0.12;}
    }

    .scanline{
      width:100%;
      height:1px;
      background:var(--muted-line);
      margin:24px 0;
      opacity:0.4;
    }
  </style>
</head>

<body>

  <h1>&gt; 404</h1>
  <p>page not found / does not exist.</p>

  <button class="cta" onclick="location.href='/'">back to home</button>

  <div class="scanline"></div>

  <p style="opacity:0.4;">z3nxth</p>

</body>
</html>
