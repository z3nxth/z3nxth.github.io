<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>110010100</title>
  <link rel="icon" type="image/x-icon" href="profile.png" />
  <style>
    :root{
      --bg: #0c0c0c;
      --muted-line: #333;
      --accent: #5adf72;
      --accent-2: #7cff8a;
      --text: #d0f0d0;
      --mono: "JetBrains Mono", monospace;
    }

    html,body{
      background:var(--bg);
      color:var(--text);
      font-family:var(--mono);
      margin:0;
      padding:0;
      -webkit-font-smoothing:antialiased;
      height:100%;
    }

    body{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px;
    }

    h1{
      font-size:3rem;
      color:var(--accent-2);
      margin:0 0 14px;
    }

    p{
      color:var(--p);
      font-size:1.05rem;
      margin:0 0 28px;
    }

    a{
      color:var(--accent);
      font-weight:600;
      text-decoration:none;
    }
    a:hover{color:var(--accent-2);text-decoration:underline;}

    .scanline{
      width:100%;
      height:1px;
      background:var(--muted-line);
      margin:24px 0;
      opacity:0.4;
    }

    button.cta{
      background:transparent;
      border:1px solid var(--accent-2);
      padding:8px 14px;
      border-radius:6px;
      cursor:pointer;
      color:var(--accent-2);
      font-weight:600;
    }
    button.cta:hover{
      background:#7cff8a22;
    }
  </style>
</head>

<body>
  <h1>&gt; 404</h1>
  <p>page does not exist or was not found</p>

  <button class="cta" onclick="location.href='/'">take me home</button>

  <div class="scanline"></div>

  <p style="opacity:0.5;">z3nxth / iftekhar syed</p>
</body>
</html>
