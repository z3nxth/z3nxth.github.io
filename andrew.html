<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET WELL SOON ANDREW!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Impact', 'Comic Sans MS', cursive, sans-serif;
            overflow-x: hidden;
            background: #000;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><circle cx="10" cy="10" r="8" fill="lime"/></svg>'), auto;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, #ff0080, #ff8c00, #ffff00, #00ff00, #0080ff, #8000ff, #ff0080);
            background-size: 100% 1000%;
            animation: rainbowScroll 2s linear infinite;
            filter: brightness(1.5) contrast(1.3);
        }

        @keyframes rainbowScroll {
            0% { background-position: 0% 0%; }
            100% { background-position: 0% 100%; }
        }

        .strobe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            animation: strobe 0.15s infinite;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        @keyframes strobe {
            0%, 40%, 80% { opacity: 0; }
            20%, 60%, 100% { opacity: 0.3; }
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-text {
            font-size: 18vw;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 
                -3px -3px 0px #ff00ff,
                3px -3px 0px #00ffff,
                -3px 3px 0px #ff0000,
                3px 3px 0px #00ff00,
                0px 0px 20px #fff,
                0px 0px 40px #fff,
                0px 0px 60px #fff;
            animation: megaBounce 0.3s infinite alternate, spin 4s linear infinite, scaleFlash 0.2s infinite;
            text-align: center;
            line-height: 0.9;
            letter-spacing: -0.05em;
            -webkit-text-stroke: 3px black;
        }

        @keyframes megaBounce {
            0% { transform: translateY(0px) scale(1) skew(0deg); }
            100% { transform: translateY(-50px) scale(1.3) skew(-5deg); }
        }

        @keyframes spin {
            0% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
            100% { transform: rotate(-10deg); }
        }

        @keyframes scaleFlash {
            0%, 100% { filter: brightness(1.5) saturate(2); }
            50% { filter: brightness(3) saturate(3); }
        }

        .word {
            display: block;
            animation: wordShake 0.1s infinite;
        }

        @keyframes wordShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-5px, 5px) rotate(-2deg); }
            50% { transform: translate(5px, -5px) rotate(2deg); }
            75% { transform: translate(-5px, -5px) rotate(-1deg); }
        }

        .sub-text {
            font-size: 12vw;
            font-weight: 900;
            color: #fff;
            text-shadow: 
                0 0 10px #ff00ff,
                0 0 20px #00ffff,
                0 0 30px #ff0000,
                3px 3px 0px #000;
            margin-top: 30px;
            animation: megaPulse 0.4s infinite, shake 0.2s infinite;
            -webkit-text-stroke: 2px black;
        }

        @keyframes megaPulse {
            0%, 100% { transform: scale(1) rotate(-5deg); }
            50% { transform: scale(1.5) rotate(5deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .sparkle {
            position: absolute;
            font-size: 10vw;
            animation: sparkleExplode 0.8s infinite;
            pointer-events: none;
        }

        @keyframes sparkleExplode {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(5) rotate(720deg); opacity: 0; }
        }

        .emoji-explosion {
            position: fixed;
            font-size: 15vw;
            animation: explode 1s linear infinite;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(2) rotate(720deg); opacity: 0; }
        }

        .laser {
            position: fixed;
            height: 5px;
            background: linear-gradient(90deg, transparent, #ff00ff, #00ffff, transparent);
            width: 100%;
            animation: laserScan 1s linear infinite;
            pointer-events: none;
            box-shadow: 0 0 20px #fff;
        }

        @keyframes laserScan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        .blink {
            animation: hyperBlink 0.1s linear infinite;
        }

        @keyframes hyperBlink {
            0%, 50% { opacity: 1; color: #ff0000; }
            25%, 75% { opacity: 0; color: #00ff00; }
        }

        .rotating-bg {
            position: fixed;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: 
                repeating-linear-gradient(45deg, transparent, transparent 50px, rgba(255,0,255,0.3) 50px, rgba(255,0,255,0.3) 100px),
                repeating-linear-gradient(-45deg, transparent, transparent 50px, rgba(0,255,255,0.3) 50px, rgba(0,255,255,0.3) 100px);
            animation: rotateBG 5s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateBG {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .popup-message {
            position: fixed;
            font-size: 8vw;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 3px 3px 0 #000, 0 0 20px #fff;
            -webkit-text-stroke: 2px #ff00ff;
            animation: popupFloat 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes popupFloat {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-100px) scale(1.5) rotate(360deg); opacity: 0.7; }
        }

        @media (max-width: 768px) {
            .main-text {
                font-size: 20vw;
                -webkit-text-stroke: 2px black;
            }
            .sub-text {
                font-size: 15vw;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="strobe"></div>
    <div class="rotating-bg"></div>
    <div class="laser"></div>
    
    <div class="container">
        <div class="main-text">
            <span class="word">GET</span>
            <span class="word">WELL</span>
            <span class="word">SOON</span>
            <span class="word">ANDREW<span class="blink">!!!</span></span>
        </div>
        <div class="sub-text">
            💚 WE MISS YOU 💚
        </div>
    </div>

    <script>
        // MAXIMUM SPARKLE EXPLOSION
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.textContent = ['✨', '⭐', '💫', '🌟', '⚡'][Math.floor(Math.random() * 5)];
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            sparkle.style.animationDelay = Math.random() * 0.5 + 's';
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 800);
        }

        setInterval(createSparkle, 50);

        // EMOJI EXPLOSION EVERYWHERE
        const emojis = ['❤️', '💙', '💚', '💛', '💜', '🧡', '🎉', '🎊', '🎈', '🎆', '✨', '⭐', '🌟', '💖', '💗', '💝', '🔥', '⚡', '🌈'];
        function createEmojiExplosion() {
            const emoji = document.createElement('div');
            emoji.className = 'emoji-explosion';
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            
            const startX = Math.random() * 100;
            const startY = Math.random() * 100;
            emoji.style.left = startX + '%';
            emoji.style.top = startY + '%';
            
            const tx = (Math.random() - 0.5) * 200;
            const ty = (Math.random() - 0.5) * 200;
            emoji.style.setProperty('--tx', tx + 'vw');
            emoji.style.setProperty('--ty', ty + 'vh');
            
            emoji.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
            document.body.appendChild(emoji);
            setTimeout(() => emoji.remove(), 1000);
        }

        setInterval(createEmojiExplosion, 100);

        // POPUP MESSAGES
        const messages = ['FEEL BETTER!', 'YOU GOT THIS!', 'HEALING VIBES!', 'COME BACK SOON!', 'REST UP!'];
        function createPopup() {
            const popup = document.createElement('div');
            popup.className = 'popup-message';
            popup.textContent = messages[Math.floor(Math.random() * messages.length)];
            popup.style.left = Math.random() * 80 + 10 + '%';
            popup.style.top = Math.random() * 80 + 10 + '%';
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 2000);
        }

        setInterval(createPopup, 1500);

        // SCREEN SHAKE ON TOUCH
        document.addEventListener('touchstart', function() {
            document.body.style.animation = 'none';
            setTimeout(() => {
                document.body.style.animation = '';
            }, 10);
        });
    </script>
</body>
</html>
